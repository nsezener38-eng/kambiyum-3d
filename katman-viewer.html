.stage.ready .instant-poster{opacity:0;pointer-events:none}
model-viewer{
  position:absolute;inset:0;z-index:2;
  display:block;width:100%;height:100%;
  background:transparent;--poster-color:transparent
}

.view-hint{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:4;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:112px;
  height:112px;
  border:1px solid rgba(20,20,20,.24);
  border-radius:50%;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  color:#171717;
  opacity:1;
  transition:opacity .35s ease, transform .35s ease;
}
.view-hint::before{
  content:"↔";
  display:block;
  font-size:18px;
  line-height:1;
  margin-bottom:8px;
  opacity:.7;
  animation:viewPulse 1.6s ease-in-out infinite;
}
.view-hint strong{
  font-size:11px;
  font-weight:500;
  letter-spacing:.16em;
}
.view-hint span{
  margin-top:5px;
  font-size:8px;
  letter-spacing:.14em;
  opacity:.5;
}
.stage.interacted .view-hint{
  opacity:0;
  transform:translate(-50%,-50%) scale(.92);
}
@keyframes viewPulse{
  0%,100%{transform:translateX(-3px);opacity:.45}
  50%{transform:translateX(3px);opacity:.9}
}

.k3d-footer{border-top:1px solid rgba(0,0,0,.12);padding-top:18px;display:grid;grid-template-columns:1fr 2fr;gap:36px;align-items:end}
.size{display:flex;flex-direction:column;gap:5px}
.size span{font-size:10px;font-weight:400;letter-spacing:.12em;opacity:.5}
.size strong{font-size:20px;font-weight:400}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.features div{border-left:1px solid rgba(0,0,0,.12);padding-left:12px;display:flex;flex-direction:column;gap:5px}
.features span{font-size:10px;font-weight:400;letter-spacing:.04em;opacity:.55}
.features strong{font-size:13px;font-weight:400;letter-spacing:.08em}



/* K3D DESKTOP ZOOM CONTROLS */
.k3d-zoom-controls{
  position:absolute;
  z-index:20;
  right:24px;
  top:50%;
  transform:translateY(-50%);
  display:flex;
  flex-direction:column;
  gap:10px;
  pointer-events:auto;
}
.k3d-zoom-controls button{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0;
  padding:0 0 2px;
  border:1px solid rgba(24,21,24,.28);
  border-radius:50%;
  background:#fff;
  color:#181518;
  font-family:'Figtree',Arial,Helvetica,sans-serif;
  font-size:23px;
  font-weight:400;
  line-height:1;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.07);
  transition:border-color .18s ease, transform .18s ease;
}
.k3d-zoom-controls button:hover{
  border-color:rgba(116,21,21,.55);
  background:#fff;
  transform:scale(1.04);
}
.k3d-zoom-controls button:active{
  transform:scale(.96);
}
.k3d-zoom-controls button:focus-visible{
  outline:2px solid #741515;
  outline-offset:3px;
}
@media(max-width:700px){

  /* Mobilde 01 / 02 / 03 özellik satırını kaldır */
  .features{
    display:none !important;
  }

  .k3d-footer{
    grid-template-columns:1fr !important;
  }

  .k3d-zoom-controls{display:none !important;}
}

@media(max-width:700px){
  .k3d{padding:26px 18px 22px}
  .k3d h2{font-size:26px}
  .k3d p{max-width:220px}
  .k3d-360 strong{font-size:21px}
  .k3d-360 span{display:none}
  .stage{margin:0 -18px;width:calc(100% + 36px);height:390px}
  .view-hint{width:96px;height:96px}
  .view-hint strong{font-size:10px}
  .k3d-footer{grid-template-columns:1fr;gap:18px}
  .features{gap:6px}

  /* Mobilde 01 / 02 / 03 görünürlüğünü sabitle */
  .features span{
    display:block !important;
    visibility:visible !important;
    opacity:.58 !important;
    color:#151515 !important;
    font-size:10px !important;
    font-weight:400 !important;
    line-height:1 !important;
    margin-bottom:4px !important;
  }
  .features div{padding-left:8px}
  .features strong{font-size:10px;line-height:1.35}
}
</style>
</head>
<body>
<section class="k3d">
  <div class="k3d-head">
    <div>
      <div class="k3d-kicker">ÜRÜNÜ KEŞFET</div>
      <h2>Katman Kitaplık</h2>
      <p>Ürünün formunu ve detaylarını her açıdan inceleyin.</p>
    </div>
    <div class="k3d-360"><strong>360°</strong><span>SÜRÜKLE / DÖNDÜR</span></div>
  </div>

  <div class="stage" id="stage">
    <div class="instant-poster" aria-hidden="true"></div>
    <div class="view-hint" id="viewHint" aria-hidden="true">
      <strong>VIEW 360°</strong>
      <span>SÜRÜKLE</span>
    </div>

    <model-viewer
      id="viewer"
      src="./KATMAN-KITAPLIK_3_V10-STIL.glb"
      alt="Kambiyum Katman Kitaplık 3D görünümü"
      camera-controls
      auto-rotate
      auto-rotate-delay="2200"
      rotation-per-second="1.5deg"
      interaction-prompt="none"
      camera-target="1.8m 1.0835m -0.135m"
      camera-orbit="30deg 70deg 5.5m"
      field-of-view="25deg"
      min-camera-orbit="auto auto 4.65m"
      max-camera-orbit="auto auto 6.35m"
      environment-image="neutral"
      exposure="0.56"
      shadow-intensity="0.82"
      shadow-softness="0.85"
      touch-action="pan-y"
      loading="eager">
    </model-viewer>

    <div class="k3d-zoom-controls" aria-label="3D yakınlaştırma kontrolleri">
      <button type="button" id="zoomIn" aria-label="Yakınlaştır">+</button>
      <button type="button" id="zoomOut" aria-label="Uzaklaştır">−</button>
    </div>
  </div>

  <div class="k3d-footer">
    <div class="size">
      <span>GENİŞLİK × YÜKSEKLİK × DERİNLİK</span>
      <strong>360 × 216,7 × 27 CM</strong>
    </div>
    <div class="features">
      <div><span>01</span><strong>MODÜLER YAPI</strong></div>
      <div><span>02</span><strong>MALZEME DOKUSU</strong></div>
      <div><span>03</span><strong>DEMONTE TASARIM</strong></div>
    </div>
  </div>
</section>

<script>
const viewer = document.getElementById('viewer');
const stage = document.getElementById('stage');
viewer.addEventListener('load', () => stage.classList.add('ready'), {once:true});

const markInteracted = () => stage.classList.add('interacted');
stage.addEventListener('pointerdown', markInteracted, {once:true});
stage.addEventListener('touchstart', markInteracted, {once:true, passive:true});




/* DESKTOP WHEEL PASS-THROUGH
   Native model zoom remains enabled for mobile pinch.
   On desktop, stop the wheel before model-viewer receives it;
   browser default scrolling remains active because preventDefault is not used. */
stage.addEventListener('wheel', (e) => {
  if (window.matchMedia('(min-width: 701px)').matches) {
    e.stopPropagation();
  }
}, {capture:true, passive:true});

const zoomInBtn = document.getElementById('zoomIn');
const zoomOutBtn = document.getElementById('zoomOut');

/* Stabil masaüstü zoom:
   Görüş açısı küçüldükçe model yakınlaşır, büyüdükçe uzaklaşır.
   Fare tekeri model tarafından tutulmaz. */
let currentFov = 25;
const FOV_MIN = 19;
const FOV_MAX = 31;
const FOV_STEP = 3;

async function applyK3dFov(nextFov){
  if (!viewer || window.matchMedia('(max-width: 700px)').matches) return;

  currentFov = Math.max(FOV_MIN, Math.min(FOV_MAX, nextFov));
  viewer.fieldOfView = `${currentFov}deg`;

  /* Lit/model-viewer property update tamamlandıktan sonra hedefe geç. */
  if (viewer.updateComplete) {
    await viewer.updateComplete;
  }
  viewer.jumpCameraToGoal();
  stage.classList.add('interacted');
}

zoomInBtn?.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  applyK3dFov(currentFov - FOV_STEP);
});

zoomOutBtn?.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  applyK3dFov(currentFov + FOV_STEP);
});

</script>
</body>
</html>
